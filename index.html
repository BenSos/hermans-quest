<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Herman's Quest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      #access-gate {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        padding: 24px; color: #f7ecd2; background:
          radial-gradient(circle at 50% 10%, rgba(80, 165, 196, .55), transparent 35%),
          linear-gradient(160deg, #183f57, #0c202d 72%);
        font-family: 'Nunito', system-ui, sans-serif;
      }
      .access-card {
        width: min(400px, 100%); padding: 32px; text-align: center; border: 4px solid #f7ecd2;
        border-radius: 22px; background: rgba(16, 31, 38, .88);
        box-shadow: 0 12px 0 rgba(0, 0, 0, .3), 0 0 50px rgba(233, 185, 60, .2);
      }
      .access-card h1 { margin: 0; font: 900 clamp(30px, 8vw, 44px) 'Cinzel', Georgia, serif; color: #f8d264; }
      .access-card p { margin: 8px 0 24px; font-weight: 800; color: #dcebf0; }
      .access-card label { display: block; margin-bottom: 8px; text-align: left; font-size: 13px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
      .access-card input { width: 100%; padding: 13px 14px; border: 3px solid #f7ecd2; border-radius: 10px; color: #3b2716; background: #fff8e8; font: 800 17px 'Nunito', system-ui, sans-serif; }
      .access-card button { width: 100%; margin-top: 14px; padding: 12px 16px; border: 3px solid #f7ecd2; border-radius: 10px; color: #3b2716; background: #f8d264; box-shadow: 0 4px 0 rgba(0, 0, 0, .3); cursor: pointer; font: 900 17px 'Nunito', system-ui, sans-serif; }
      .access-card button:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0, 0, 0, .3); }
      .access-error { min-height: 20px; margin: 10px 0 0; color: #ffaaa7; font-weight: 800; }
      .access-card input:focus-visible, .access-card button:focus-visible { outline: 3px solid #f8d264; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <main id="access-gate">
      <form class="access-card" id="access-form">
        <h1>Herman’s Quest</h1>
        <p>A family adventure awaits.</p>
        <label for="access-code">Family passcode</label>
        <input id="access-code" name="access-code" type="password" autocomplete="current-password" required autofocus />
        <button type="submit">Enter the quest</button>
        <p class="access-error" id="access-error" role="alert" aria-live="polite"></p>
      </form>
    </main>
    <script>
      (() => {
        const unlockKey = 'hermans-quest-access-v1';
        const passcodeHash = 'de5547117d387c552c9bb37a4ea5fbf62f6beabe589698a57167543b5097d22f';
        const gate = document.getElementById('access-gate');
        const form = document.getElementById('access-form');
        const input = document.getElementById('access-code');
        const error = document.getElementById('access-error');

        const openGame = () => {
          gate.remove();
          const game = document.createElement('script');
          game.type = 'module';
          game.src = '/src/main.ts';
          document.body.append(game);
        };

        const hash = async (value) => {
          const bytes = new TextEncoder().encode(value);
          const digest = await crypto.subtle.digest('SHA-256', bytes);
          return [...new Uint8Array(digest)].map((byte) => byte.toString(16).padStart(2, '0')).join('');
        };

        try {
          if (localStorage.getItem(unlockKey) === 'true') {
            openGame();
            return;
          }
        } catch { /* Private browsing can disable local storage. */ }

        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          try {
            if (await hash(input.value) !== passcodeHash) {
              error.textContent = 'That passcode is not quite right.';
              input.select();
              return;
            }
            try { localStorage.setItem(unlockKey, 'true'); } catch { /* Continue without remembering this device. */ }
            openGame();
          } catch {
            error.textContent = 'Please open the game from its secure web address.';
          }
        });
      })();
    </script>
  </body>
</html>
